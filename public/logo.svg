<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Becherwerk – Prüfstelle für Glühwein in ganz Deutschland. Gemacht und betrieben von David (Bayern) und Philip (Hamburg).">
  <defs>
    <!-- Oben im Uhrzeigersinn, Schrift steht nach außen -->
    <path id="oben" d="M 60 256 A 196 196 0 0 1 452 256"/>
    <!-- Unten gegen den Uhrzeigersinn, damit die Schrift lesbar bleibt -->
    <path id="unten" d="M 38 256 A 218 218 0 0 0 474 256"/>
  </defs>

  <!-- Siegelring -->
  <circle cx="256" cy="256" r="250" fill="#7B1E2B"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#D9A640" stroke-width="3"/>
  <circle cx="256" cy="256" r="176" fill="#FBF7F6" stroke="#D9A640" stroke-width="4"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" fill="#FBF7F6" letter-spacing="2">
    <text font-size="27"><textPath href="#oben" startOffset="50%" text-anchor="middle" textLength="520" lengthAdjust="spacing">BECHERWERK · PRÜFSTELLE FÜR GLÜHWEIN</textPath></text>
    <text font-size="21"><textPath href="#unten" startOffset="50%" text-anchor="middle" textLength="560" lengthAdjust="spacing">GEMACHT &amp; BETRIEBEN VON DAVID &amp; PHILIP</textPath></text>
  </g>
  <!-- Trennpunkte bei 9 und 3 Uhr -->
  <circle cx="49" cy="262" r="6" fill="#D9A640"/>
  <circle cx="463" cy="262" r="6" fill="#D9A640"/>

  <!-- Messskala innen: zehn Striche über den oberen Bogen, der zehnte in Gold -->
  <g stroke="#7B1E2B" stroke-linecap="butt" opacity=".85">
    <g id="striche" stroke-width="2.5">
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-112.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-87.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-62.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-37.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-12.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(12.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(37.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(62.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(87.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="116" stroke="#D9A640" stroke-width="4" transform="rotate(112.5 256 256)"/>
    </g>
  </g>

  <!-- Becherwerk: Gurt mit drei nach oben fördernden Bechern -->
  <rect x="200" y="150" width="44" height="182" rx="22" fill="none" stroke="#7B1E2B" stroke-width="11"/>
  <g fill="#7B1E2B">
    <path d="M 256 286 h 54 l -7 34 h -40 z"/>
    <path d="M 256 228 h 54 l -7 34 h -40 z"/>
    <path d="M 256 170 h 54 l -7 34 h -40 z"/>
  </g>
  <!-- Dampf über dem obersten Becher -->
  <g fill="none" stroke="#D9A640" stroke-width="4" stroke-linecap="round">
    <path d="M 272 160 c -6 -8 6 -14 0 -24"/>
    <path d="M 292 160 c -6 -8 6 -14 0 -24"/>
  </g>
  <!-- Messstrich und Herkunft -->
  <rect x="176" y="344" width="160" height="5" fill="#7B1E2B"/>
  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" fill="#7B1E2B">
    <text x="256" y="374" font-size="15" letter-spacing="2.5">BAYERN × HAMBURG</text>
    <text x="256" y="394" font-size="11" letter-spacing="1.5" opacity=".75">DEUTSCHLAND · SEIT 2025</text>
  </g>
</svg>
