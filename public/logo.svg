<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Glühlabor – Prüfstelle für Glühwein in ganz Deutschland. Gemacht und betrieben von David (Bayern) und Philip (Hamburg).">
  <defs>
    <!-- Oben im Uhrzeigersinn, Schrift steht nach außen -->
    <path id="oben" d="M 60 256 A 196 196 0 0 1 452 256"/>
    <!-- Unten gegen den Uhrzeigersinn, damit die Schrift lesbar bleibt -->
    <path id="unten" d="M 38 256 A 218 218 0 0 0 474 256"/>
    <!-- Innenraum des Glaskolbens, begrenzt die Flüssigkeit -->
    <clipPath id="kolben">
      <path d="M236 168 L236 218 L186 318 Q178 336 198 336 L314 336 Q334 336 326 318 L276 218 L276 168 Z"/>
    </clipPath>
  </defs>

  <!-- Siegelring -->
  <circle cx="256" cy="256" r="250" fill="#7B1E2B"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#D9A640" stroke-width="3"/>
  <circle cx="256" cy="256" r="176" fill="#FBF7F6" stroke="#D9A640" stroke-width="4"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" fill="#FBF7F6" letter-spacing="2">
    <text font-size="27"><textPath href="#oben" startOffset="50%" text-anchor="middle" textLength="500" lengthAdjust="spacing">GLÜHLABOR · PRÜFSTELLE FÜR GLÜHWEIN</textPath></text>
    <text font-size="21"><textPath href="#unten" startOffset="50%" text-anchor="middle" textLength="560" lengthAdjust="spacing">GEMACHT &amp; BETRIEBEN VON DAVID &amp; PHILIP</textPath></text>
  </g>
  <!-- Trennpunkte bei 9 und 3 Uhr -->
  <circle cx="49" cy="262" r="6" fill="#D9A640"/>
  <circle cx="463" cy="262" r="6" fill="#D9A640"/>

  <!-- Messskala innen: zehn Striche über den oberen Bogen, der zehnte in Gold -->
  <g stroke="#7B1E2B" stroke-linecap="butt" opacity=".85">
    <g stroke-width="2.5">
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-112.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-87.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-62.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-37.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(-12.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(12.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(37.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(62.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="108" transform="rotate(87.5 256 256)"/>
      <line x1="256" y1="92" x2="256" y2="116" stroke="#D9A640" stroke-width="4" transform="rotate(112.5 256 256)"/>
    </g>
  </g>

  <!-- Glaskolben mit Glühwein -->
  <g clip-path="url(#kolben)">
    <path d="M170 282 Q213 270 256 282 T342 282 V340 H170 Z" fill="#7B1E2B"/>
    <circle cx="232" cy="314" r="5" fill="#D9A640"/>
    <circle cx="262" cy="302" r="4" fill="#D9A640"/>
    <circle cx="286" cy="320" r="6" fill="#D9A640"/>
    <circle cx="246" cy="292" r="3" fill="#D9A640"/>
  </g>
  <path d="M236 168 L236 218 L186 318 Q178 336 198 336 L314 336 Q334 336 326 318 L276 218 L276 168" fill="none" stroke="#7B1E2B" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M226 164 H286" stroke="#7B1E2B" stroke-width="9" stroke-linecap="round"/>
  <!-- Messstriche am Kolben -->
  <g stroke="#7B1E2B" stroke-width="3.5" stroke-linecap="round">
    <line x1="298" y1="250" x2="314" y2="250" stroke="#D9A640"/>
    <line x1="308" y1="270" x2="322" y2="270"/>
    <line x1="318" y1="290" x2="332" y2="290"/>
    <line x1="328" y1="310" x2="342" y2="310"/>
  </g>
  <!-- Dampf -->
  <g fill="none" stroke="#D9A640" stroke-width="5" stroke-linecap="round">
    <path d="M246 150 c-8 -10 8 -18 0 -30"/>
    <path d="M266 150 c-8 -10 8 -18 0 -30"/>
  </g>
  <!-- Messstrich und Herkunft -->
  <rect x="176" y="346" width="160" height="5" fill="#7B1E2B"/>
  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" fill="#7B1E2B">
    <text x="256" y="376" font-size="15" letter-spacing="2.5">BAYERN × HAMBURG</text>
    <text x="256" y="398" font-size="11" letter-spacing="1.5" opacity=".75">DEUTSCHLAND · SEIT 2025</text>
  </g>
</svg>
