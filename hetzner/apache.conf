# Apache: a2enmod proxy proxy_http headers ssl rewrite. Zertifikat: sudo certbot --apache -d gluehlabor.de -d www.gluehlabor.de
<VirtualHost *:80>
    ServerName gluehlabor.de
    ServerAlias www.gluehlabor.de
    CustomLog /dev/null combined
    RewriteEngine On
    RewriteRule ^ https://gluehlabor.de%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName gluehlabor.de
    # SSLCertificateFile und SSLCertificateKeyFile trägt certbot ein
    CustomLog /dev/null combined
    LimitRequestBody 102400
    ProxyPreserveHost On
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-For
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
