# nginx: neue Datei /etc/nginx/sites-available/gluehlabor.de, dann nach sites-enabled verlinken.
# Zertifikat: sudo certbot --nginx -d gluehlabor.de -d www.gluehlabor.de
server {
    listen 80;
    listen [::]:80;
    server_name gluehlabor.de www.gluehlabor.de;
    access_log off;                       # keine IP-Adressen protokollieren (Datenschutz)
    return 301 https://gluehlabor.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gluehlabor.de;
    # ssl_certificate und ssl_certificate_key trägt certbot ein
    access_log off;                       # keine IP-Adressen protokollieren
    client_max_body_size 100k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # echte Adresse für den Missbrauchsschutz
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";              # nichts Fremdes durchreichen
        proxy_read_timeout 30s;
    }
}
