name: Märkte aktualisieren

# Holt Weihnachtsmärkte aus OpenStreetMap und öffnet einen Pull Request mit data/maerkte-osm.json.
# Manuell starten (Actions → Märkte aktualisieren → Run workflow), dann den Pull Request ansehen und mergen.
on:
  workflow_dispatch:
    inputs:
      extrakt:
        description: 'Geofabrik-Auszug (Standard Bayern). Beispiele: germany/baden-wuerttemberg, austria. Leer = nur über Overpass (oft überlastet).'
        default: 'germany/bayern'

permissions:
  contents: write
  pull-requests: write

jobs:
  maerkte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Overpass antwortet vom GitHub-Runner aus oft nicht (Zeitüberschreitungen). Verlässlicher: der Auszug von Geofabrik (ein paar hundert MB)
      # mit osmium auf Märkte filtern und das Ergebnis dem Skript geben.
      - name: Auszug laden und filtern
        if: ${{ inputs.extrakt != '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fL --retry 3 -o auszug.osm.pbf "https://download.geofabrik.de/europe/${{ inputs.extrakt }}-latest.osm.pbf"
          ls -lh auszug.osm.pbf
          osmium tags-filter auszug.osm.pbf nwr/amenity=marketplace nwr/market nwr/event nwr/seasonal=winter nwr/amenity=events_venue nwr/amenity=festival_grounds -o gefiltert.osm.pbf --overwrite
          osmium export gefiltert.osm.pbf -f geojsonseq -o gefiltert.geojsonseq --overwrite
          ls -lh gefiltert.geojsonseq
      - run: node scripts/maerkte-osm.mjs
        env:
          GEOJSONSEQ: ${{ inputs.extrakt != '' && 'gefiltert.geojsonseq' || '' }}
      - name: Pull Request öffnen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/maerkte-osm.json; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          zweig="maerkte-osm-$(date +%Y%m%d-%H%M)"
          git checkout -b "$zweig"
          git add data/maerkte-osm.json
          git commit -m "Märkte aus OpenStreetMap aktualisiert"
          git push origin "$zweig"
          # Darf Actions keine Pull Requests öffnen (Repo-Einstellung), scheitert das hier. Der Zweig ist dann trotzdem gepusht: Link im Log.
          gh pr create --base main --head "$zweig" --title "Märkte aus OpenStreetMap aktualisiert" --body "Automatisch erzeugt von scripts/maerkte-osm.mjs. Stichproben ansehen (data/maerkte-osm.json), dann mergen." || echo "::warning::Pull Request konnte nicht geöffnet werden. Der Zweig $zweig ist gepusht: https://github.com/${{ github.repository }}/compare/main...$zweig?expand=1"
